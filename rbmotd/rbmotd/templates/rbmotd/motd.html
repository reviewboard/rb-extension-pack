{% load i18n %}

{% if motd_enabled %}
<div id="{{banner_id}}" style="display: none;" role="region"
     aria-labelledby="{{banner_id}}-message">
 <h2 id="{{banner_id}}-message">{{motd_message|safe}}</h2>
{%  if banner_can_close %}
 <a href="#" id="{{banner_id}}_close" class="ink-i-close" role="button"
    tabindex="0"
    aria-label="{% trans "Dismiss" %}"
    title="{% trans "Dismiss" %}"></a>
{%  endif %}
</div>

{%  include "rbmotd/scripts.html" %}
{% endif %}
